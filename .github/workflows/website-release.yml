name: Release Website

on:
  push:
    tags:
      - 'website-v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: website-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Preflight and deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          if ! echo "$TAG" | grep -Eq '^website-v[0-9]+(\.[0-9]+)*([-+][[:alnum:].-]+)?$'; then
            echo "Invalid tag: $TAG" >&2
            exit 1
          fi
          DESKTOP_VERSION="${TAG#website-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "desktop_version=$DESKTOP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (desktop v${DESKTOP_VERSION})"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Preflight build and test
        working-directory: myrm-website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_BAKED_RELEASE: '1'
          DESKTOP_VERSION: ${{ steps.tag.outputs.desktop_version }}
          WEBSITE_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          bun install
          bun run build
          bun run test

      - name: Assert origin/main matches release tag
        run: |
          set -euo pipefail
          git fetch origin main
          tag_commit="$(git rev-parse HEAD)"
          main_commit="$(git rev-parse origin/main)"
          if [ "$tag_commit" != "$main_commit" ]; then
            echo "origin/main (${main_commit:0:7}) != tag commit (${tag_commit:0:7}). Push main before POST Deploy Hook." >&2
            exit 1
          fi
          echo "origin/main matches tag commit (${tag_commit:0:7})"

      - name: Trigger Cloudflare Pages deploy hook
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "${CF_PAGES_DEPLOY_HOOK:-}" ]; then
            echo "Missing CF_PAGES_DEPLOY_HOOK repository secret." >&2
            exit 1
          fi
          http_code="$(curl -sS -o /tmp/hook-response -w '%{http_code}' -X POST "$CF_PAGES_DEPLOY_HOOK")"
          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ] && [ "$http_code" != "202" ]; then
            echo "Deploy hook failed: HTTP ${http_code}" >&2
            cat /tmp/hook-response >&2 || true
            exit 1
          fi
          echo "Deploy hook accepted (${{ steps.tag.outputs.tag }} → myrmagent.ai). Check CF Pages → Deployments."

      - name: Post-deploy desktop-release smoke
        env:
          DESKTOP_VERSION: ${{ steps.tag.outputs.desktop_version }}
        run: |
          set -euo pipefail
          echo "[post-deploy] Waiting 90s for Cloudflare Pages build…"
          sleep 90
          payload="$(curl -fsSL 'https://myrmagent.ai/desktop-release.json')"
          version="$(jq -r '.version // empty' <<<"$payload")"
          target_count="$(jq '.targets | length' <<<"$payload")"
          if [[ -z "$version" ]]; then
            echo "[post-deploy] desktop-release.json has empty version" >&2
            exit 1
          fi
          echo "[post-deploy] desktop manifest v${version} (website tag desktop_version=${DESKTOP_VERSION})"
          if [[ "$target_count" -lt 4 ]]; then
            echo "[post-deploy] expected >= 4 install targets, got ${target_count}" >&2
            exit 1
          fi
          win_file="$(jq -r '.targets[] | select(.id == "windows-x86_64") | .fileName // empty' <<<"$payload" | head -1)"
          case "$win_file" in
            *.msi) ;;
            *)
              echo "[post-deploy] windows target must be .msi installer, got: ${win_file:-<empty>}" >&2
              exit 1
              ;;
          esac
          echo "[post-deploy] OK (version=${version}, targets=${target_count}, windows=${win_file})"
