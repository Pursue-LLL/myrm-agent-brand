name: Website CI

on:
  push:
    branches: ["main"]
    paths:
      - "myrm-website/**"
      - "myrm-docs/**"
      - ".github/workflows/website-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "myrm-website/**"
      - "myrm-docs/**"
      - ".github/workflows/website-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myrm-website
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate docs slug contract
        run: bun run validate:docs-slugs
      - name: Bake desktop release manifest
        run: bun run bake:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: bun run build
